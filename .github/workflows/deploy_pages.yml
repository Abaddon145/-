name: Deploy PWA

on:
  push:
    branches: [main, "codex/milestone-1-ios-foundation"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Download Drift web runtime
        run: |
          curl -L --fail https://github.com/simolus3/drift/releases/download/drift-2.35.0/sqlite3.wasm -o web/sqlite3.wasm
          curl -L --fail https://github.com/simolus3/drift/releases/download/drift-2.35.0/drift_worker.js -o web/drift_worker.js
      - name: Build installable PWA
        run: flutter build web --release --base-href "/-/" --pwa-strategy offline-first
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
