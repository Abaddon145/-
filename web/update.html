<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>更新韩语记忆</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#f7f8ff,#e4ecf5);font-family:system-ui;color:#28334e}
    main{margin:24px;padding:32px;max-width:380px;border-radius:28px;background:#ffffffdd;border:1px solid #fff;box-shadow:0 16px 60px #25365714}
    h1{font-size:25px;line-height:1.4}p{line-height:1.8;color:#56637d}
    button{width:100%;border:0;border-radius:17px;padding:16px;background:#6267d8;color:white;font:600 16px system-ui;cursor:pointer}
    button:disabled{opacity:.6}a{display:block;text-align:center;margin-top:18px;color:#6267d8}
  </style>
</head>
<body><main>
  <h1>更新韩语记忆</h1>
  <p>v0.5.0 · 账户与云同步<br>更新会保留本机词库、学习进度和打卡。</p>
  <button id="update">更新并打开应用</button>
  <p id="status" role="status"></p>
  <a href="./">直接打开应用</a>
</main>
<script>
  document.getElementById('update').onclick = async () => {
    const button = document.getElementById('update');
    const status = document.getElementById('status');
    button.disabled = true; status.textContent = '正在下载更新，请保持联网…';
    try {
      if (!('serviceWorker' in navigator)) { location.replace('./?v=0.5.0'); return; }
      const registration = await navigator.serviceWorker.register('offline_worker.js', {updateViaCache:'none'});
      await registration.update();
      if (registration.installing) {
        const installing = registration.installing;
        await new Promise((resolve, reject) => {
          const check = () => {
            if (installing.state === 'installed' || installing.state === 'activated') resolve();
            else if (installing.state === 'redundant') reject(new Error('缓存安装失败，请重试'));
          };
          installing.addEventListener('statechange', check); check();
        });
      }
      if (registration.waiting) {
        await new Promise(resolve => {
          navigator.serviceWorker.addEventListener('controllerchange', resolve, {once:true});
          registration.waiting.postMessage('ACTIVATE_UPDATE');
        });
      }
      await navigator.serviceWorker.ready;
      location.replace('./?v=0.5.0');
    } catch (error) {
      status.textContent = '更新未完成：' + error.message + '。可稍后重试，本机记录未被清理。';
      button.disabled = false;
    }
  };
</script>
</body>
</html>
