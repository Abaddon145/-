<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="支持 Excel 自定义词库与 FSRS 复习的韩语学习应用。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#5B6CFF">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="韩语记忆">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>韩语记忆</title>
</head>
<body>
  <script>
    // Existing learning data lives in IndexedDB and is not touched by app updates.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('offline_worker.js');
          const offerUpdate = () => {
            if (!registration.waiting || document.getElementById('app-update')) return;
            const button = document.createElement('button');
            button.id = 'app-update';
            button.textContent = '新版已就绪，点击更新';
            button.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:99999;padding:12px 20px;border:0;border-radius:18px;background:#34395f;color:white;font:15px system-ui;box-shadow:0 4px 20px #0003';
            button.onclick = () => {
              navigator.serviceWorker.addEventListener('controllerchange', () => location.reload(), {once:true});
              registration.waiting.postMessage('ACTIVATE_UPDATE');
            };
            document.body.appendChild(button);
          };
          offerUpdate();
          registration.addEventListener('updatefound', () => {
            registration.installing?.addEventListener('statechange', () => {
              if (navigator.serviceWorker.controller) offerUpdate();
            });
          });
          await registration.update();
        } catch (error) { console.warn('Offline cache is unavailable', error); }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
