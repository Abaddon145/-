name: korean_memo
description: A local-first Korean vocabulary learning app with Excel import and FSRS.
publish_to: none
version: 0.6.0+9

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1
  file_picker: ^13.1.0
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.5
  fsrs: ^2.0.1
  go_router: ^17.5.0
  uuid: ^4.5.1
  url_launcher: ^6.3.2
  supabase_flutter: 2.18.3
  crypto: 3.0.7
  http: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/default_word_books.json
    - assets/data/technical_word_books.json
